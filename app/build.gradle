plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def resolvedVersionCode = (System.getenv("NANA_VERSION_CODE") ?: "200").toInteger()
def resolvedVersionName = System.getenv("NANA_VERSION_NAME") ?: "2.0.${resolvedVersionCode}-gtasa200-aml140"

def releaseKeystorePath = System.getenv("NANA_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("NANA_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("NANA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("NANA_KEY_PASSWORD")
def hasReleaseSigning = releaseKeystorePath && releaseKeystorePassword && releaseKeyAlias && releaseKeyPassword && file(releaseKeystorePath).exists()

android {
    namespace 'com.nana.samp'
    compileSdk 35
    ndkVersion '26.2.11394342'

    defaultConfig {
        applicationId 'com.nana.samp'
        minSdk 24
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20', '-O2'
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    sourceSets {
        main {
            // Staged dynamically from downloaded GTA SA 2.00 AML 1.4.0 + Alyn sources via scripts/fetch_and_prepare_sources.py
            jniLibs.srcDirs += ['build/generated/gtasa200/jniLibs']
            assets.srcDirs += ['build/generated/gtasa200/assets']
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../native/CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    testOptions {
        unitTests {
            returnDefaultValues = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
